
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ma messagerie - Assistance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--blue:#1769ff;--navy:#101d3a;--muted:#71809b;--bg:#f4f7fc;--border:#e8edf5}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Poppins,sans-serif;background:var(--bg);color:var(--navy);min-height:100vh}
button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}
.top{height:70px;background:white;display:flex;align-items:center;justify-content:space-between;padding:0 5%;box-shadow:0 3px 20px #1428500a}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px}
.logo{width:39px;height:39px;border-radius:12px;background:linear-gradient(135deg,#287bff,#0648c8);color:white;display:grid;place-items:center}
.top-actions{display:flex;align-items:center;gap:12px}
.email{font-size:11px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 15px;border-radius:10px;font-size:11px;font-weight:600}
.btn svg{width:16px}
.primary{background:linear-gradient(135deg,#2678ff,#1052d4);color:white}
.light{background:#eef4ff;color:var(--blue)}
.danger{background:#fff0f0;color:#d04444}
.layout{max-width:1150px;margin:30px auto;padding:0 17px;display:grid;grid-template-columns:310px 1fr;gap:17px;min-height:calc(100vh - 125px)}
.panel{background:white;border:1px solid var(--border);border-radius:17px;box-shadow:0 12px 35px #1939690b;overflow:hidden}
.panel-head{padding:18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center}
.panel-head h2{font-size:13px}
.list{max-height:calc(100vh - 240px);overflow:auto}
.item{padding:16px 18px;border-bottom:1px solid #f0f3f8;cursor:pointer}
.item:hover,.item.active{background:#eef5ff}
.item strong{font-size:11px;display:block}
.item small{font-size:9px;color:var(--muted);display:block;margin-top:6px}
.item p{font-size:10px;margin-top:7px;color:#51617b}
.empty{padding:35px 18px;text-align:center;font-size:11px;color:var(--muted);line-height:1.8}
.chat{display:flex;flex-direction:column;min-height:620px}
.chat-head{padding:18px 20px;border-bottom:1px solid var(--border)}
.chat-head h2{font-size:14px}
.chat-head p{font-size:10px;color:var(--muted);margin-top:5px}
.messages{flex:1;min-height:350px;max-height:calc(100vh - 290px);overflow-y:auto;background:#f8faff;padding:20px}
.bubble{max-width:78%;padding:11px 14px;border-radius:13px;font-size:11px;line-height:1.7;margin-bottom:12px;overflow-wrap:anywhere}
.bubble.user{background:#1769ff;color:white;margin-left:auto;border-bottom-right-radius:4px}
.bubble.admin{background:white;border:1px solid var(--border);border-bottom-left-radius:4px}
.bubble small{display:block;opacity:.65;font-size:9px;margin-top:5px}
.compose{display:flex;gap:9px;padding:14px;border-top:1px solid var(--border)}
.compose textarea{flex:1;min-width:0;resize:none;height:46px;border:1px solid var(--border);border-radius:10px;padding:12px;font-size:11px;outline:none}
.compose textarea:focus{border-color:#5b95ff}
.compose button{width:47px}
.welcome{flex:1;display:grid;place-items:center;text-align:center;padding:30px;color:var(--muted);font-size:12px}
.welcome svg{width:40px;height:40px;margin-bottom:12px;color:#9eafc8}
.overlay{display:none;position:fixed;inset:0;background:#071630a8;z-index:10;align-items:center;justify-content:center;padding:16px}
.overlay.show{display:flex}
.dialog{background:white;border-radius:18px;padding:25px;width:100%;max-width:420px}
.dialog h2{font-size:19px;margin-bottom:7px}
.dialog p{font-size:11px;color:var(--muted);margin-bottom:18px}
.field{margin-bottom:14px}
.field label{font-size:11px;font-weight:600;display:block;margin-bottom:7px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--border);border-radius:10px;padding:12px;font-size:11px;outline:none;background:#fbfcff}
.field textarea{height:110px;resize:vertical}
.status{font-size:11px;margin-top:10px}
.error{color:#d33}.success{color:#16834c}
@media(max-width:760px){.layout{grid-template-columns:1fr;margin:15px auto}.list{max-height:220px}.chat{min-height:570px}.messages{max-height:400px}.email{display:none}.top{padding:0 13px}.brand{font-size:13px}.bubble{max-width:90%}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo"><i data-lucide="headset"></i></span>Ma messagerie</div>
  <div class="top-actions"><span class="email" id="userEmail"></span><button class="btn danger" id="logout"><i data-lucide="log-out"></i> Déconnexion</button></div>
</header>

<main class="layout">
  <aside class="panel">
    <div class="panel-head"><h2>Mes conversations</h2><button class="btn primary" id="newBtn"><i data-lucide="plus"></i> Nouvelle</button></div>
    <div class="list" id="conversationList"><div class="empty">Chargement...</div></div>
  </aside>

  <section class="panel chat">
    <div id="welcome" class="welcome"><div><i data-lucide="messages-square"></i><p>Choisissez une conversation ou créez-en une nouvelle.</p></div></div>
    <div id="chatContent" style="display:none;flex-direction:column;flex:1">
      <div class="chat-head"><h2 id="chatTitle">Conversation</h2><p id="chatState"></p></div>
      <div class="messages" id="messages"></div>
      <form class="compose" id="messageForm">
        <textarea id="messageInput" placeholder="Écrire un message..." maxlength="2000" required></textarea>
        <button class="btn primary" type="submit" aria-label="Envoyer"><i data-lucide="send"></i></button>
      </form>
      <div class="status" id="messageStatus" style="padding:0 15px 10px"></div>
    </div>
  </section>
</main>

<div class="overlay" id="newDialog">
  <form class="dialog" id="newForm">
    <h2>Nouvelle conversation</h2>
    <p>Expliquez votre demande à l'équipe d'assistance.</p>
    <div class="field"><label>Sujet</label><select id="subject" required><option value="">Choisir un sujet</option><option>Compte utilisateur</option><option>Dépôt ou retrait</option><option>Application mobile</option><option>Autre demande</option></select></div>
    <div class="field"><label>Votre message</label><textarea id="firstMessage" maxlength="2000" required placeholder="Écrivez votre message..."></textarea></div>
    <button class="btn primary" type="submit">Envoyer la demande <i data-lucide="send"></i></button>
    <button class="btn light" type="button" id="cancelNew">Annuler</button>
    <div class="status" id="newStatus"></div>
  </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
lucide.createIcons();
let socket=null;
let currentId=null;
let currentStatus="open";

async function api(url,options={}){
  const r=await fetch(url,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});
  const d=await r.json();
  if(!r.ok)throw new Error(d.error||"Erreur");
  return d;
}
function status(id,msg,type=""){
  const el=document.getElementById(id);
  el.textContent=msg;el.className="status "+type;
}
async function init(){
  try{
    const me=await api("/api/auth/me");
    if(me.role!=="user")throw new Error("Session utilisateur requise");
    document.getElementById("userEmail").textContent=me.user.email;
    socket=io();
    socket.on("conversation:updated",data=>{
      loadList();
      if(data.conversationId===currentId)loadConversation();
    });
    await loadList();
  }catch(e){location.href="/";}
}
async function loadList(){
  const d=await api("/api/conversations");
  const list=document.getElementById("conversationList");
  list.innerHTML="";
  if(!d.conversations.length){list.innerHTML='<div class="empty">Aucune conversation.<br>Cliquez sur « Nouvelle » pour commencer.</div>';return;}
  d.conversations.forEach(c=>{
    const el=document.createElement("div");
    el.className="item"+(c.id===currentId?" active":"");
    const title=document.createElement("strong");title.textContent=c.subject;
    const date=document.createElement("small");date.textContent=new Date(c.updatedAt).toLocaleString("fr-FR");
    const detail=document.createElement("p");detail.textContent=c.status==="closed"?"Conversation clôturée":"Conversation ouverte";
    el.append(title,date,detail);
    el.onclick=()=>selectConversation(c.id);
    list.appendChild(el);
  });
}
async function selectConversation(id){
  currentId=id;
  document.getElementById("welcome").style.display="none";
  document.getElementById("chatContent").style.display="flex";
  await loadList();
  await loadConversation();
}
async function loadConversation(){
  if(!currentId)return;
  const d=await api("/api/conversations/"+encodeURIComponent(currentId));
  const c=d.conversation;
  currentStatus=c.status;
  document.getElementById("chatTitle").textContent=c.subject;
  document.getElementById("chatState").textContent=c.status==="closed"?"Conversation clôturée":"Conversation ouverte";
  const box=document.getElementById("messages");
  box.innerHTML="";
  c.messages.forEach(m=>{
    const b=document.createElement("div");
    b.className="bubble "+(m.sender==="user"?"user":"admin");
    const content=document.createElement("span");content.textContent=m.message;
    const date=document.createElement("small");date.textContent=new Date(m.createdAt).toLocaleString("fr-FR");
    b.append(content,date);box.appendChild(b);
  });
  box.scrollTop=box.scrollHeight;
  const input=document.getElementById("messageInput");
  input.disabled=c.status==="closed";
  input.placeholder=c.status==="closed"?"Cette conversation est clôturée":"Écrire un message...";
  document.querySelector("#messageForm button").disabled=c.status==="closed";
}
document.getElementById("newBtn").onclick=()=>document.getElementById("newDialog").classList.add("show");
document.getElementById("cancelNew").onclick=()=>document.getElementById("newDialog").classList.remove("show");
document.getElementById("newDialog").onclick=e=>{if(e.target.id==="newDialog")e.currentTarget.classList.remove("show")};

document.getElementById("newForm").onsubmit=async e=>{
  e.preventDefault();
  try{
    const d=await api("/api/conversations",{method:"POST",body:JSON.stringify({
      subject:document.getElementById("subject").value,
      message:document.getElementById("firstMessage").value
    })});
    document.getElementById("newForm").reset();
    document.getElementById("newDialog").classList.remove("show");
    await selectConversation(d.conversation.id);
  }catch(err){status("newStatus",err.message,"error")}
};

document.getElementById("messageForm").onsubmit=async e=>{
  e.preventDefault();
  const input=document.getElementById("messageInput");
  const message=input.value.trim();
  if(!message||!currentId)return;
  try{
    input.disabled=true;
    await api("/api/conversations/"+encodeURIComponent(currentId)+"/messages",{method:"POST",body:JSON.stringify({message})});
    input.value="";
    status("messageStatus","Message envoyé.","success");
    await loadConversation();
  }catch(err){status("messageStatus",err.message,"error")}
  finally{if(currentStatus!=="closed")input.disabled=false}
};

document.getElementById("logout").onclick=async()=>{
  await api("/api/auth/logout",{method:"POST"});
  location.href="/";
};
init();
</script>
</body>
</html>
